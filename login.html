<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - Sistema de Citas Médicas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
    <h1>🏥 Sistema de Citas Médicas</h1>
    <p>Inicio de sesión</p>
</header>

<main class="contenedor">

    <section class="bienvenida">
        <h2>Iniciar sesión</h2>

        <form id="formLogin">

            <label for="correo">Correo electrónico</label>
            <br>
            <input type="email" id="correo" placeholder="Ingrese su correo" required>

            <br><br>

            <label for="password">Contraseña</label>
            <br>
            <input type="password" id="password" placeholder="Ingrese su contraseña" required>

            <br><br>

            <button type="submit" class="boton">
                Iniciar sesión
            </button>

        </form>

        <br>

        <p>
            ¿No tienes una cuenta?
            <a href="registro.html">Registrarse</a>
        </p>

        <br>

        <a href="index.html" class="boton secundario">
            Volver al inicio
        </a>

    </section>

</main>

<footer>
    <p>© 2026 Sistema de Gestión de Citas Médicas</p>
</footer>

<script src="js/app.js"></script>

</body>
</html>
