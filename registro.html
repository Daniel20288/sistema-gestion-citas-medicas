<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Citas Médicas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
    <h1>🏥 Sistema de Citas Médicas</h1>
    <p>Registro de usuario</p>
</header>

<main class="contenedor">

    <section class="bienvenida">
        <h2>Crear una cuenta</h2>

        <form id="formRegistro">

            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Ingrese su nombre" required>

            <br><br>

            <label for="documento">Número de documento</label>
            <input type="text" id="documento" placeholder="Ingrese su documento" required>

            <br><br>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="Ingrese su correo" required>

            <br><br>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingrese una contraseña" required>

            <br><br>

            <button type="submit" class="boton">
                Registrarse
            </button>

        </form>

        <br>

        <p>
            ¿Ya tienes una cuenta?
            <a href="login.html">Iniciar sesión</a>
        </p>

        <br>

        <a href="index.html" class="boton secundario">
            Volver al inicio
        </a>

    </section>

</main>

<footer>
    <p>© 2026 Sistema de Gestión de Citas Médicas</p>
</footer>

<script src="js/app.js"></script>

</body>
</html>
